</head>
<body>
  <p><a href="/portfolio/">Continue to Judy Wu's portfolio</a></p>

  <!--
    This page is a redirect stub, so the normal GoatCounter script never gets to
    run before we navigate away. Instead, fire a counting pixel for "/" with the
    real external referrer, then redirect. Without this, anyone landing on the
    bare domain was invisible, and /portfolio/ recorded the referrer as this
    site rather than wherever they actually came from.
  -->
  <script>
    (function () {
      var next = '/portfolio/' + location.search + location.hash;
      var done = false;
      function go() {
        if (done) return;
        done = true;
        location.replace(next);
      }

      var px = new Image();
      px.onload = px.onerror = go;
      px.src = 'https://judylhwu-work.goatcounter.com/count'
        + '?p=' + encodeURIComponent('/')
        + '&t=' + encodeURIComponent(document.title)
        + '&r=' + encodeURIComponent(document.referrer)
        + '&rnd=' + Math.random().toString(36).slice(2);

      // Don't let a blocked or slow beacon hold the visitor here.
      setTimeout(go, 500);
    })();
  </script>
</body>
</html>
