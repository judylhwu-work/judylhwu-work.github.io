  <script>
  /* Recover mistyped and renamed URLs.

     GitHub Pages serves this file for any unmatched path with no chance to
     redirect server-side, so the matching happens here. Order of preference:
       1. an exact alias  — a URL we know we renamed, so we know the answer
       2. a close fuzzy match on the slug or the whole path
       3. the portfolio landing page

     Asset requests (a missing .png, .css) are left alone — bouncing those to a
     page would turn a broken image into a confusing navigation. */
  (function () {
    var cfg;
    try { cfg = JSON.parse(document.getElementById('routes').textContent); }
    catch (e) { return; }

    var here = location.pathname;

    // A missing file is not a mistyped page.
    if (/\.(png|jpe?g|gif|svg|webp|ico|css|js|json|xml|txt|pdf|woff2?|ttf|map)$/i.test(here)) return;

    // Viewing /404.html directly should show the page, not bounce off it.
    if (/^\/404(\.html)?$/i.test(here)) return;

    function norm(p) {
      return String(p).toLowerCase()
        .replace(/index\.html?$/, '')
        .replace(/\.html?$/, '')
        .replace(/[_\s]+/g, '-')
        .replace(/[^a-z0-9/-]/g, '')
        .replace(/-+/g, '-')
        .replace(/\/+/g, '/')
        .replace(/^\/|\/$/g, '');
    }

    function slug(p) {
      var parts = norm(p).split('/').filter(Boolean);
      return parts.length ? parts[parts.length - 1] : '';
    }

    // Levenshtein, normalised to a 0-1 similarity.
    function sim(a, b) {
      if (a === b) return 1;
      if (!a.length || !b.length) return 0;
      var prev = [], cur = [], i, j;
      for (j = 0; j <= b.length; j++) prev[j] = j;
      for (i = 1; i <= a.length; i++) {
        cur[0] = i;
        for (j = 1; j <= b.length; j++) {
          cur[j] = Math.min(prev[j] + 1, cur[j - 1] + 1,
                            prev[j - 1] + (a.charAt(i - 1) === b.charAt(j - 1) ? 0 : 1));
        }
        prev = cur.slice();
      }
      return 1 - prev[b.length] / Math.max(a.length, b.length);
    }

    var nHere = norm(here), sHere = slug(here);

    // 1. Exact alias.
    var aliases = cfg.aliases || {};
    for (var key in aliases) {
      if (norm(key) === nHere) { go(aliases[key], null); return; }
    }

    // 2. Exact route, differing only in case / trailing slash / .html. This has
    //    to beat the fuzzy stage outright: a perfect match can otherwise lose the
    //    runner-up margin test to a route it happens to be a prefix of.
    var exact = (cfg.routes || []).filter(function (r) { return norm(r.url) === nHere; })[0];
    if (exact) { go(exact.url, null); return; }

    // 3. Best fuzzy match, scored on both the slug and the full path.
    var best = null, second = 0;
    (cfg.routes || []).forEach(function (r) {
      var rSlug = slug(r.url);
      var slugScore = sim(sHere, rSlug);
      var score = Math.max(slugScore, sim(nHere, norm(r.url)));
      // A truncated URL ("/projects/nova-to/") is a prefix of what was meant,
      // but edit distance prefers the SHORTER neighbour ("nova"). Treat a real
      // prefix as a strong signal so truncation resolves the way people expect.
      if (sHere.length >= 4 && rSlug.indexOf(sHere) === 0) {
        slugScore = Math.max(slugScore, 0.92);
        score = Math.max(score, 0.92);
      }
      var cand = { r: r, score: score, slugScore: slugScore };
      if (!best || score > best.score) { second = best ? best.score : 0; best = cand; }
      else if (score > second) { second = score; }
    });

    // Confident = close overall, the slug itself is a real match (not just a
    // shared parent folder), and clearly ahead of the runner-up.
    if (best && best.score >= 0.68 && best.slugScore >= 0.5 && (best.score - second) >= 0.10) {
      go(best.r.url, best.r.label);
      return;
    }

    // 4. Give up gracefully.
    go(cfg.fallback || '/portfolio/', null);

    function go(target, label) {
      if (target === here) return;   // literal compare: normalising here would
                                     // cancel the case/slash/.html fixes we make
      var note = document.getElementById('nf-note');
      var link = document.getElementById('nf-go');
      if (note) {
        note.textContent = label
          ? 'That looks like ' + label + ' — taking you there now.'
          : 'Taking you to the portfolio.';
        note.hidden = false;
      }
      if (link) { link.href = target; link.hidden = false; }
      setTimeout(function () { location.replace(target); }, label ? 1200 : 1800);
    }
  })();
  </script>
